# Configuración para Hasier Etxapare Kareaga
# Titulación: Grado en Filología Inglesa + Máster en Traducción Profesional + Perfil C1 Inglés (PI)

portal:
  base_url: "https://appseducacion.navarra.es/atp/"
  login_path: "index.xhtml"

user:
  preferred_localities:
    - "Pamplona"
    - "Burlada"
    - "Villava"
    - "Ansoáin"
    - "Barañáin"
    - "Zizur Mayor"
    - "Tudela"
    - "Estella"
    - "Tafalla"
  specialty_preference_order:
    - "Inglés"
    - "Lengua Castellana y Literatura"

# Listas donde el usuario está "Disponible" (L/M/X/V):
# Como Hasier aún no pertenece a ninguna lista ordinaria, se deja vacío para que solo participe los jueves.
available_lists: []

# Listas abiertas los jueves según formación universitaria (Anexo I de la normativa):
# - 0590 Inglés: Por Grado + Acreditación C1
# - 0590 Lengua Castellana y Literatura: Por Grado en Filología Inglesa ("Filología en otra especialidad" / "Estudios filológicos en otros idiomas") y Máster en Traducción
# - 0592 Inglés (Escuelas Oficiales de Idiomas): Por Grado + Acreditación C1
thursday_open_specialties:
  - body: "0590"
    specialty: "Inglés"
  - body: "0590"
    specialty: "Lengua Castellana y Literatura"
  - body: "0592"
    specialty: "Inglés"

scheduler:
  daily_start: "13:25"
  daily_end: "14:05"
  poll_interval_seconds: 120

runtime:
  dry_run: true
  log_level: "INFO"
  storage_path: "~/.navarra-edu-bot-jasier/state.db"
  log_path: "~/.navarra-edu-bot-jasier/logs/"
